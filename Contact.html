<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Contact Us</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/jpeg" sizes="32x32" href="logo.jpg">
    <link rel="apple-touch-icon" type="image/jpeg" sizes="180x180" href="logo.jpg">
    <link rel="icon" type="image/jpeg" sizes="192x192" href="logo.jpg">
    <link rel="shortcut icon" type="image/jpeg" sizes="32x32" href="logo.jpg">
    <link rel="stylesheet" href="styles2.css">
</head>

<body>
    <div class="contact">
        <form action="https://example.com/submit-form" method="POST" class="contact-left">
            <div class="contact-left-title">
                <h2>Get in Touch</h2>
                <hr>
            </div>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name" class="contact-input" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your Email" class="contact-input" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Your Message" class="contact-input" required></textarea>

            <button type="submit" aria-label="Submit Contact Form">
                Submit <img src="submit.png" alt="Submit Icon">
            </button>
        </form>

        <div class="contact-right">
            <img src="contact.jpg" alt="Contact Illustration">
        </div>
    </div>
	
	<footer>
        <p>&copy; aabdi4@student.clayton.edu | Due Date: 10/19/2025</p>
    </footer>
</body>
</html>
